<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ · Baristech Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="loginForm" novalidate>
    <div class="logo" id="logo"></div>
    <h1>เข้าสู่ระบบ</h1>
    <p class="sub">Baristech Cafe — สำหรับเจ้าของร้านและแคชเชียร์</p>
    <div class="form-row"><label for="username">ชื่อผู้ใช้</label>
      <input type="text" id="username" autocomplete="username" autofocus></div>
    <div class="form-row"><label for="password">รหัสผ่าน</label>
      <input type="password" id="password" autocomplete="current-password"
       ></div>
    <div class="err" id="err" style="margin-bottom:10px"></div>
    <button class="btn primary block" id="go" type="submit">เข้าสู่ระบบ</button>
  </form>
</div>
<script src="/js/login.js"></script>
</body>
</html>
